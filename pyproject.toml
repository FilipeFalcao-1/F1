[project]
name = "f1"
version = "0.1.0"
description = "Pipeline de dados da OpenF1 API: bronze (JSON), silver (Parquet) e gold (DuckDB)"
authors = [
    {name = "Filipe Falcao",email = "filipe13743@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "polars (>=2.1.0,<3.0.0)",
    "duckdb (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "streamlit (>=1.66.1,<2.0.0)"
]

[project.scripts]
f1 = "f1.main:main"

[project.optional-dependencies]
dashboard = ["streamlit (>=1.66.1,<2.0.0)"]
[tool.poetry]
packages = [{include = "f1", from = "src"}]
requires-poetry = ">=2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py314"  # manter alinhado ao requires-python
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erros)
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes: imports/variáveis não usados, nomes indefinidos
    "I",    # isort: organização de imports
    "B",    # flake8-bugbear: bugs prováveis
    "UP",   # pyupgrade: sintaxe moderna
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "T20",  # flake8-print: proíbe print()
    "RUF",  # regras específicas do Ruff
]
ignore = [
    "E501",  # comprimento de linha é responsabilidade do formatter
]

[tool.ruff.lint.isort]
known-first-party = ["f1"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # efetivo se a família "D" for habilitada

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not live"]
markers = [
    "integration: testes ponta a ponta com fixtures locais (sem rede)",
    "live: smoke tests contra a API real da OpenF1 (rodar com -m live)",
]

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
source = ["f1"]
branch = true

[tool.coverage.report]
fail_under = 50  # piso obrigatório; só pode subir
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "mkdocs-material (>=9.8.0,<10.0.0)",
    "mkdocstrings[python] (>=1.0.8,<2.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

# ---------------------------------------------------------------- Taskipy
[tool.taskipy.tasks]
docs = { cmd = "mkdocs serve", help = "Serve a documentação em http://127.0.0.1:8000" }
docs-build = { cmd = "mkdocs build --strict", help = "Gera a documentação e falha em qualquer warning" }
